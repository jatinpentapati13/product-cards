<!DOCTYPE html>
<html>
<head>
    <title>Product Cards</title>

    <style>
        body {
            font-family: Arial;
            background-color: lightgray;
            text-align: center;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 50px;
        }

        .card {
            background: white;
            padding: 20px;
            width: 180px;
            border-radius: 10px;
            box-shadow: 0 2px 8px gray;
        }
    </style>
</head>

<body>

    <h1>Product Store</h1>

    <div class="container">

        <div class="card">
            <h2>Laptop</h2>
            <p>Price: ₹50000</p>
        </div>

        <div class="card">
            <h2>Mobile</h2>
            <p>Price: ₹20000</p>
        </div>

        <div class="card">
            <h2>Headphones</h2>
            <p>Price: ₹2000</p>
        </div>

        <div class="card">
            <h2>Keyboard</h2>
            <p>Price: ₹1500</p>
        </div>

    </div>

</body>
</html>
